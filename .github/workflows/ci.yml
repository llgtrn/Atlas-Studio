name: Atlas Systemizer CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Enforce the Atlas control root and the knowledge root (ADR 0104)
        shell: bash
        run: |
          test -f tools/atlas/repo.toml
          test -d tools/atlas/declared
          test -d .ynventa/knowledge
          test ! -e .atlas
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Ynventa verify (the knowledge authority)
        run: cargo run -q --manifest-path .ynventa/Cargo.toml -- verify --root .
