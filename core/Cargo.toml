[package]
name = "core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Pure Atlas vocabulary and invariants only: IDs, facts, graph primitives, bindings, evidence,
# policies and manifest contracts. No filesystem, Git, provider, donor or UI mechanics.

[dependencies]
serde.workspace = true
serde_json.workspace = true

# Test-only differential oracle for the native `identity::blake3` port (ADR 0005). Never a
# production dependency: Atlas computes every digest with its own implementation.
[dev-dependencies]
blake3 = "=1.8.7"
# Test-only differential oracle for the native `identity::ed25519` verifier (ADR 0085). Never a
# production dependency: Atlas verifies signatures with its own implementation and never signs.
ed25519-compact = { version = "=2.6.0", default-features = false }
