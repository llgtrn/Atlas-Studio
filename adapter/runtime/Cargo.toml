[package]
name = "runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Runtime turns core semantics into repository compilation, work preparation, verification and
# evidence flows. It depends on adapter mechanics through typed outputs, not raw shell contracts.

[dependencies]
atlas_core = { package = "core", path = "../../core" }
adapter = { path = ".." }
serde.workspace = true
serde_json.workspace = true

# Test-only: tests sign authority events as a principal would, outside Atlas (ADR 0085). Atlas
# itself only verifies signatures, natively, and never signs.
[dev-dependencies]
ed25519-compact = { version = "=2.6.0", default-features = false }
