[workspace]
resolver = "2"
members = [
  "crates/atlas-model",
  "crates/atlas-source",
  "crates/atlas-repo",
  "crates/atlas-fact",
  "crates/atlas-graph",
  "crates/atlas-technology",
  "crates/atlas-design",
  "crates/atlas-docs",
  "crates/atlas-build",
  "crates/atlas-refactor",
  "crates/atlas-fleet",
  "crates/atlas-proof",
  "crates/atlas-core",
  "crates/atlas-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
