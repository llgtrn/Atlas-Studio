schema = "atlas.docs.v1"
version = 1
source_standard = "Atlas Studio"
exceptions_allowed = false
canonical_knowledge_root = ".atlas"
legacy_docs_root_forbidden = true
coding_requires_docs_gate = true
all_markdown_requires_frontmatter = true
required_frontmatter = ["id", "type", "status", "canonical"]
document_types = ["decision", "blueprint", "architecture", "contract", "runbook", "reference", "generated-evidence"]

required_control_docs = [
  "README.md",
  "INDEX.md",
  "TEMPLATE.md",
  "architecture/README.md",
  "architecture/constitution/NORTH-STAR.md",
  "architecture/SYSTEM.md",
  "architecture/INVENTION-PIPELINE.md",
  "architecture/DIGITAL-ORGANISM.md",
  "blueprints/SYSTEM-BLUEPRINT.md",
  "blueprints/COMPILER-ROADMAP.md",
  "blueprints/BULK-DONOR-ABSORPTION.md",
  "blueprints/ORGANISM-COMPILATION.md",
  "contracts/SYSTEM-CONTRACT.md",
  "contracts/ATLAS-GENOME.md",
  "contracts/UNIVERSAL-GRAPH-CONTRACT.md",
  "contracts/CENSUS-COMPLETENESS.md",
  "contracts/ATLAS-FORMAT.md",
  "contracts/ATLAS-SHARDING.md",
  "contracts/ATLASX-FORMAT.md",
  "contracts/ORGANISM-GENOME-v1.md",
  "contracts/ORGANISM-LIFECYCLE.md",
  "contracts/ORGANISM-MODEL-ADMISSION.md",
  "contracts/ORGANISM-HOMEOSTASIS-METABOLISM.md",
  "contracts/COMPILER-PRODUCT.md",
  "standards/CENSUS-SCOPE.md",
  "standards/COMPILER-OPTIMIZATION.md",
  "genome/README.md",
  "decisions/README.md",
  "guides/DEVELOPMENT.md",
  "references/README.md"
]

[semantic_sufficiency]
placeholder_tokens_forbidden = ["TODO", "TBD", "PLACEHOLDER", "FILL_ME"]
required_section_min_characters = 40

[canonicality]
generated_evidence_may_be_canonical = false
meaning_changes_require_review = true
duplicate_canonical_ids_forbidden = true
broken_internal_refs_forbidden = true
superseded_docs_must_link_successor = true
legacy_docs_duplicate_forbidden = true
binary_artifact_exports_are_not_docs_truth = true

[coding_admission]
repo_gate_required = true
docs_gate_required = true
north_star_required = true
architecture_required = true
blueprint_required = true
contracts_required = true
genome_required = true
census_completeness_contract_required = true
universal_graph_contract_required = true
atlas_sharding_contract_required = true
compiler_product_contract_required = true
organism_genome_contract_required = true
organism_lifecycle_contract_required = true
organism_model_admission_contract_required = true
organism_homeostasis_metabolism_contract_required = true
compiler_optimization_standard_required = true
development_guide_required = true
code_before_docs_forbidden = true
exact_base_sha_required = true
single_repository_target_required = true
