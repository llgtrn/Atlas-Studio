schema = "atlas.ui.v3"
version = 3
implementation_language = "TypeScript/TSX"

[principles]
world_canvas_is_primary = true
semantic_lod_required = true
viewport_is_query = true
frontend_is_not_semantic_authority = true
evidence_visible = true
accessibility_required = true
design_donor_is_not_runtime_authority = true
three_d_requires_semantic_mapping = true

[lod]
levels = ["world", "territory", "system", "architecture", "component", "module", "symbol", "source"]

[layers]
supported = ["architecture", "code", "capability", "dependency", "security", "performance", "execution", "evidence", "provenance", "design", "innovation", "history"]

[surfaces]
primary = ["world_canvas", "search", "layers", "timeline", "inspector"]
secondary = ["source", "design", "diff", "terminal", "agents"]
