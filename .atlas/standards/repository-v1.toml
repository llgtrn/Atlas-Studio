schema = "atlas.repository-standard.v1"
version = 1

[principles]
canonical_knowledge_root = ".atlas"
legacy_docs_root_forbidden = true
generated_state_rebuildable = true
one_canonical_target_per_workrun = true
exact_base_sha_required_for_mutation = true
merge_authority_outside_atlas = true
docs_standard_required = true
graph_before_code_required = true

[target]
docs_contract = "atlas.docs.v1"
atlas_runtime_dependency_allowed = false
atlas_knowledge_root_required_for_managed_repositories = true

[implementation]
backend_language = "rust"
frontend_language = "typescript"
responsibility_roots_are_manifest_declared = true
extra_top_level_owners_require_architecture_decision = true
