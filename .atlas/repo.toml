schema = "atlas.repo.v2"
repo = "llgtrn/Atlas-Studio"
system_kind = "SYSTEM_INVENTION_FORGE"
kind = "SYSTEM_INVENTION_FORGE"

backend_language = "rust"
frontend_language = "typescript"

coding_requires_docs_gate = true
graph_before_code_required = true
exact_base_sha_required = true
single_repository_target_required = true

knowledge_root = ".atlas"
temporary_root = ".atlas/temporary"
provenance_root = ".atlas/provenance"
license_root = ".atlas/licenses"
artifact_root = ".atlas/artifacts"
legacy_docs_root_forbidden = true

[genome]
source = ".atlas/genome/atlas.genome.toml"
compiled_artifact = ".atlas/artifacts/atlas-genome.atlas"
hash_required = true
pin_on_census = true
pin_on_plan = true
pin_on_materialization = true

[formats]
dense_engineering_artifact_extension = ".atlas"
expanded_executable_suffix = ".atlasx"
atlas_binary_required = true
atlasx_markdown_authority_forbidden = true
atlasx_json_authority_forbidden = true
deterministic_materialization_required = true

[graph]
universal_spine_required = true
global_identity_required = true
cross_repository_binding_supported = true
sovereign_repository_partition_required = true
required_primitives = [
  "identity",
  "scope",
  "node",
  "edge",
  "binding",
  "state",
  "event",
  "temporal",
  "evidence",
  "provenance",
  "claim",
  "constraint",
  "invariant",
  "interface",
  "capability",
  "effect",
  "materialization"
]

[code]
source_roots = ["core", "runtime", "adapter"]
backend_roots = ["core", "runtime", "adapter"]
frontend_roots = ["apps/ui"]
test_roots = ["core/tests", "runtime/tests", "adapter/tests", "apps/ui/src"]

[commands]
compile = "cargo run -p runtime --bin atlas-systemizer -- systemize --root . --out .atlas/.cache/systemize-report.json"
test = "cargo test --workspace"
format = "cargo fmt --all"

[atlas]
durable_roots = [
  ".atlas/architecture",
  ".atlas/blueprints",
  ".atlas/contracts",
  ".atlas/decisions",
  ".atlas/genome",
  ".atlas/guides",
  ".atlas/standards",
  ".atlas/declared",
  ".atlas/census",
  ".atlas/provenance",
  ".atlas/licenses",
  ".atlas/references",
  ".atlas/evidence",
  ".atlas/artifacts"
]
transient_roots = [".atlas/.cache", ".atlas/tmp", ".atlas/temporary"]
