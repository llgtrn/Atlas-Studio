schema = "atlas.repo.v2"
repo = "llgtrn/Atlas-Studio"
system_kind = "SYSTEM_INVENTION_FORGE"
kind = "SYSTEM_INVENTION_FORGE"

backend_language = "rust"
frontend_language = "typescript"

coding_requires_docs_gate = true
graph_before_code_required = true
exact_base_sha_required = true
single_repository_target_required = true

knowledge_root = ".atlas"
temporary_root = ".atlas/temporary"
provenance_root = ".atlas/provenance"
license_root = ".atlas/licenses"
legacy_docs_root_forbidden = true

[code]
source_roots = ["core", "runtime", "adapter"]
backend_roots = ["core", "runtime", "adapter"]
frontend_roots = ["apps/ui"]
test_roots = ["core/tests", "runtime/tests", "adapter/tests", "apps/ui/src"]

[commands]
compile = "cargo run -p runtime --bin atlas-systemizer -- systemize --root . --out .atlas/.cache/systemize-report.json"
test = "cargo test --workspace"
format = "cargo fmt --all"

[atlas]
human_readable = true
durable_roots = [
  ".atlas/architecture",
  ".atlas/blueprints",
  ".atlas/contracts",
  ".atlas/decisions",
  ".atlas/guides",
  ".atlas/standards",
  ".atlas/declared",
  ".atlas/census",
  ".atlas/provenance",
  ".atlas/licenses",
  ".atlas/references",
  ".atlas/evidence",
  ".atlas/artifacts"
]
transient_roots = [".atlas/.cache", ".atlas/tmp", ".atlas/temporary"]
