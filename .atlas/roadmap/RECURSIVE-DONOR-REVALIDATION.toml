schema = "atlas.recursive-donor-revalidation.v1"
canonical = true
established_in = "G121"
evaluated_at = "G137"
contract = ".atlas/contracts/ESSENTIAL-COMPLEXITY.md"
decision = ".atlas/decisions/0043-recursive-donor-revalidation.md"
donor_audit = ".atlas/roadmap/DONOR-CAPABILITY-AUDIT.toml"
debt_ledger = ".atlas/roadmap/ESSENTIAL-COMPLEXITY-DEBT.toml"
rule = "A historical donor verdict is valid evidence only for the semantic capabilities available at the time it was produced. When Atlas gains a materially stronger capability that could change that verdict, the verdict becomes REVALIDATION_REQUIRED for uses depending on that capability."

# Recursive epistemic verification, not new-donor progression (FOUNDATIONAL-ATLAS-READY.toml keeps
# NEW_DONOR_PROGRESSION BLOCKED; HISTORICAL_DONOR_REVALIDATION is allowed only when triggered here).
# A historical First-50 donor is REVALIDATION_REQUIRED when all three hold, recomputed by runtime test
# essential_complexity::historical_donor_revalidation_triggers_are_capability_based:
#   1. its decision depended on capability X (its debts in DONOR-CAPABILITY-AUDIT.toml);
#   2. a [[capability_milestone]] for X landed after its last deep census (generation age alone never
#      triggers);
#   3. the milestone can observe the donor: its languages include the donor language.
# SOURCE_EXTINCT is not EVIDENCE_ETERNALLY_CURRENT; REFERENCE_ONLY_AT_Gx is not REFERENCE_ONLY_AT_Gy;
# ABSORBED_AT_Gx is not NO_FURTHER_MECHANISM. A revalidation adds a decision layer ([[revalidation]]);
# the historical decision stays recorded. priority = sum over the delta of the age of each debt the
# milestone advanced and the donor depended on (essential debt pressure x capability delta x relevance).
# language is recorded knowledge unless language_verified (established by a materialization).

