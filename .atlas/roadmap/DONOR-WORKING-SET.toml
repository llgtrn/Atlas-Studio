schema = "atlas.donor-working-set.v1"
canonical = true
contract = ".atlas/contracts/DONOR-WORKING-SET.md"
decision = ".atlas/decisions/0021-bounded-donor-working-set.md"

# DISCOVER MANY -> QUEUE MANY -> MATERIALIZE FEW -> UNDERSTAND DEEPLY -> ABSORB NATIVELY -> VERIFY
# -> DELETE SOURCE -> RECYCLE STORAGE -> NEXT DONOR.
# Read by runtime::donor_storage and `atlas-systemizer donors working-set`; the admission gate is
# atlas_core::donor::decide_admission. Storage state lives on each donor-corpus record
# (`storage_state`, `materialization_mode`), orthogonal to decision_status.

[roots]
# Every new materialization: untracked, git-ignored scratch (.gitignore: .atlas/.cache/).
scratch = ".atlas/.cache/donors"
# Pre-ADR-0021 tracked trees: drained by extinction, never extended.
legacy_tracked = ".atlas/temporary/donors"

# Ratios with absolute floors (permille / bytes); never one machine's numbers. Free fraction is
# available / (used + available), the `df` Use% basis.
[policy]
healthy_min_free_permille = 400
pressure_min_free_permille = 200
high_pressure_min_free_permille = 100
build_headroom_permille = 250
build_headroom_min_bytes = 2_147_483_648
safety_reserve_permille = 50
safety_reserve_min_bytes = 1_073_741_824
max_working_set_permille = 250
large_donor_bytes = 268_435_456

# Local donor directories with no donor-corpus record (storage integrity violations) are recorded
# here as [[unadmitted_checkout]] (directory, classification, remedy); the integrity test fails on
# any violation not listed and on any listed one that no longer violates. None is left: the last
# one (the xz gitlink) was retired 2026-10-01 below.

# Retired legacy checkouts (owner decision 2026-10-01, unblocking the BLOCKED_ON_USER deletions above):
# held source -> census what is unique -> preserve content hashes and the provenance genuinely
# recoverable -> no build/runtime/test path -> remove the source. Provenance is RECOVERED only when
# mechanically verified (here: the in-tree .atlas-donor-source.toml origin record, checked by fetching
# the pinned commit and comparing every path by git blob id), otherwise UNKNOWN; never typed in.
# The removed trees stay addressable in git history at `last_commit_holding_source`; `manifest_sha256`
# is SHA-256 over the sorted `git ls-tree -r -l` lines ("<mode> <type> <id>\t<path>\n", paths
# relative to `path`, size column dropped). The ynventa donor records keep origin and licence
# (.ynventa/declared/donors.rs); the full census of each tree is ynventa knowledge (`knowledge`).

