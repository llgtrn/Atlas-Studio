# Machine-readable self-building generation ledger.
#
# The repository, not any agent's conversation memory, holds loop state. Every generation appends one
# [[generation]] table: its base commit, the parallel lanes dispatched and what each resolved, the
# deterministic join, the selected action, falsification/verification/extinction results, deferred
# candidates, and the next objective. A generation's own resulting commits are recorded by the
# following commit (a commit cannot name its own hash). Detailed evidence lives in the referenced
# files; runtime's generation_ledger_integrity test requires every referenced .atlas path to exist.
#
# Lifecycle per generation:
#   G_n -> parallel observe/census/falsify -> deterministic join -> decide -> absorb -> falsify
#       -> verify -> extinction evaluation -> physical extinction if eligible -> recensus
#       -> generation evidence -> G_n+1

