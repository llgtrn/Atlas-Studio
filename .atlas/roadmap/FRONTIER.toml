# Machine-readable engineering frontier: one [[lane]] per long-horizon capability lane.
#
# State vocabulary (per lane): ABSENT (no native code), CONTRACT_ONLY (canonical contract, no code),
# PARTIAL (some native code wired into production), NATIVE (capability owned and verified).
# Names like "logic-to-binary" or "self-hosted" describe TARGET directions; a lane's `state` is
# promoted only by executable evidence cited in `atlas_implementation`.
#
# The requested-donor inventory behind the `donors` fields (status, HEAD sha, SPDX license, size,
# mechanism directories) is .atlas/roadmap/frontier/requested-frontier-2026-09-24.tsv. A donor listed
# here is a frontier CANDIDATE; it enters .atlas/references/donor-corpus.toml only when admitted.

schema = "atlas.engineering-frontier.v1"
recorded_at = "2026-09-24"
admission_staging_default = "PARTIAL_SPARSE_SUBTREE for repositories above ~20 MB (precedent: mlir); FULL_SOURCE_TREE only for small repositories -- donor source is git-tracked in this repository (pack ~1 GB), so full trees of multi-GB donors are not admitted into main"

[[lane]]
id = "incremental_computation"
capability = "R5 incremental query and fixed point"
state = "PARTIAL"
atlas_implementation = "core::closure semi-naive fixed point (ADR 0004); core::identity::blake3 content identity (ADR 0005); core::census::delta inventory change detection + systemize --previous (ADR 0006); content-keyed extraction cache systemize --cache (ADR 0008); graph construction de-quadratified, systemize 187 s -> 12.9 s debug (ADR 0009)"
donors = ["salsa", "differential-dataflow", "buck2"]
blocking_question = "recompute of this repository is ~13 s debug and extraction caching is exact but yields ~6%; does any real corpus (the 15 donor workspaces) make recensus cost-dominated by a derivation that dependency-tracked invalidation would skip?"
evidence_required = "parsed bytes equal digested bytes; extractor version bumped on behaviour change; cache hit output byte-identical to recompute on this repository and on real donor workspaces"
falsification = "mutate one file, run cached and uncached systemize, compare every report byte"
dependency_status = "no donor runtime dependency"
next_action = "measure systemize stage costs on the largest admitted donor workspaces (rust, zed, wasmtime) before any Salsa/differential-dataflow invalidation work"

[[lane]]
id = "formal_reasoning"
capability = "constraint verdicts SAT/UNSAT/UNKNOWN; proofs; state-space exploration"
state = "PARTIAL"
atlas_implementation = "core::constraint::ConstraintVerdict three-valued verdict on every ADL constraint result, admission blocks VIOLATED and UNKNOWN separately (ADR 0007); no search-based solver"
donors = ["Z3 (MISSING, MIT)", "cvc5 (MISSING, BSD-3-Clause)", "Lean 4 (MISSING, Apache-2.0)", "Rocq (MISSING, LGPL-2.1, principles only)", "TLA+ tools (MISSING, MIT)", "Apalache (MISSING, redundant once Z3+TLA+)", "egglog (admitted)", "souffle (EXTINCT)"]
blocking_question = "no current consumer needs search: every ADL check is ground evaluation over finite declared facts. Which consumer arrives first -- ADL constraints with disjunction/implication, DecisionProposal.hard_constraint, or joint-satisfiability of declared constraints?"
evidence_required = "a canonical contract clause or ADL feature-admission (ATLAS-DEVELOPMENT-LANGUAGE.md 9-point gate) that introduces a non-ground constraint"
falsification = "exhaustive truth-table enumeration is an exact oracle for small instances; UNKNOWN on budget exhaustion must never become SATISFIED"
dependency_status = "no solver dependency; none installed in the build container"
next_action = "admit Z3 as PARTIAL_SPARSE_SUBTREE (src/sat, src/api/z3_api.h push/pop/check) for CDCL census when the first non-ground constraint consumer is admitted"

[[lane]]
id = "compiler_ir"
capability = "Atlas-owned multi-level IR: validated AtlasX -> HIR -> MIR -> LIR -> Machine IR (COMPILER-IR-PIPELINE.md)"
state = "CONTRACT_ONLY"
atlas_implementation = "AtlasIr is an architecture DeclaredGraph only (core/src/language/adl); no HIR/MIR/LIR types; HIR/MIR schemas have no arithmetic ops (COMPILER-IR-SCHEMAS.md)"
donors = ["mlir", "xdsl", "llvm-project", "wasmtime (Cranelift)", "QBE (MISSING, MIT, ~1.8 MB)", "egglog"]
blocking_question = "compiler input must be a validated AtlasX root (COMPILER-IR-PIPELINE.md:20) and no .atlas/.atlasx reader or writer exists; G41 lane: the wire contracts leave undefined the varint encoding, flag bits (no unsealed/required bit), a schema_id registry, record kinds/field tags for declared nodes/edges, the .atlas root-identity formula and genome_hash; AtlasX sealing additionally needs SelectedDesign and seal types (none) and ASIR types (TARGET)"
evidence_required = "an AtlasX root produced and validated by Atlas, or a BLUEPRINT-EVOLUTION amendment admitting a bounded non-product profile"
falsification = "an IR round-trip / verifier test over every node kind in the closed schema"
dependency_status = "no compiler dependency in production"
next_action = "ASIR/HIR Rust types for the closed node set, validated against COMPILER-IR-SCHEMAS.md"

[[lane]]
id = "logic_binary"
capability = "L0..L8: Atlas logic lowered to a runnable binary without an external compiler for a bounded subset"
state = "ABSENT"
atlas_implementation = "none: no executable semantics for any Atlas construct (no evaluator/interpreter); ADL0 is declarations-only"
donors = ["QBE (MISSING)", "wasmtime (Cranelift, admitted)", "object", "regalloc2", "mold", "wasm-spec", "wasm-tools"]
blocking_question = "L1 needs a computational subset: ADL0 has no numeric literals or operators; adding one must pass the ADL feature-admission gate and COMPILER-IR-SCHEMAS needs a versioned arithmetic extension"
evidence_required = "first target chosen from evidence: x86-64 ELF has a full oracle in this container (gcc, clang, as, ld, objdump, native execution); wasm has node v22; RISC-V has no execution oracle here"
falsification = "differential execution against an Atlas reference interpreter and against gcc-compiled equivalents; objdump/readelf structural checks"
dependency_status = "external toolchains may serve only as oracles (bootstrapping, recorded)"
next_action = "after compiler_ir provides HIR types: a reference interpreter for the admitted pure subset (L1 oracle)"

