schema = "atlas.priority.v1"
canonical = true
decision = ".atlas/decisions/0024-self-recensus-proof-of-nextgen.md"
established_in = "G57"
base_commit = "4fcb0d68198c58860106cf9d79c573c18637864d"

# PRIORITY RESET (G57). NEXTGEN is proven by self-recensus, not by generation numbering:
#   Atlas_N -> self census -> donor census -> gap -> absorb/implement -> Atlas_N+1
#   -> self recensus -> semantic diff -> falsify/verify -> donor terminal -> extinct/reclaim.
# Every generation from G57 declares one priority and what it serves; enforced by
# runtime tests (generation_ledger_*).

[[priority]]
id = "P0"
name = "CENSUS_KERNEL_CLOSURE"
status = "OPEN"
meaning = "a selected scope is censused to closure (see [census_closure]) and certified"

[[priority]]
id = "P1"
name = "SELF_RECENSUS_N_TO_N_PLUS_1"
status = "OPERATIONAL_FROM_G57"
meaning = "every production generation proves itself by pre-census, change, post-census, semantic diff, replay, verdict"

[[priority]]
id = "P2"
name = "ADL_ATLAS_ATLASX_END_TO_END"
status = "OPEN"
meaning = "census truth -> ADL -> validated .atlas -> deterministic .atlasx -> recensus"

[[priority]]
id = "P3"
name = "FIRST_50_DONOR_CAMPAIGN"
status = "OPEN"
meaning = "the canonical first-50 queue (FIRST-50-CAMPAIGN.toml) processed sequentially to terminal states"

[[priority]]
id = "P4"
name = "INCREMENTAL_DEPENDENCY_AWARE_RECENSUS"
status = "OPEN"
meaning = "edit -> affected facts -> recompute affected closure -> equals full-census oracle"

[[priority]]
id = "P5"
name = "ABSORPTION_EXTINCTION_STORAGE_RECYCLING"
status = "PARTIAL"
meaning = "absorb -> verify -> delete donor source -> post-delete recensus -> reclaim (ADR 0021 working set exists)"

[[priority]]
id = "P6"
name = "CONSTRUCTION_COMPILER_SUBSTRATE"
status = "OPEN"
meaning = "semantic state -> constructed artifacts, with rustc/cargo as explicit bootstrap boundaries"

# P7+: secondary workloads. Not deleted; used only as census test workloads. A generation may
# work on them only when its `serves` names the P0-P6 proof it produces evidence for.
[[secondary_workload]]
family = "CREATOR_FABRIC"
state = "FROZEN_SECONDARY_WORKLOAD"
census_role = "web behaviour -> census -> typed DOM/CSS/layout/interaction/motion semantics -> recensus after modification"

[[secondary_workload]]
family = "PHYSICAL_ENGINEERING"
state = "FROZEN_SECONDARY_WORKLOAD"
census_role = "units, constraints, dynamics and simulation evidence as census semantics"

[[secondary_workload]]
family = "PRODUCT_FOUNDRY"
state = "FROZEN_SECONDARY_WORKLOAD"
census_role = "BOM, economics and variants as census semantics; resumes after P0 + P2 + P3 underway"

[[secondary_workload]]
family = "FUTURES"
state = "FROZEN_SECONDARY_WORKLOAD"
census_role = "design search / hypotheses only as census evidence"

[[secondary_workload]]
family = "LADYBIRD_MIGRATION"
state = "DEFERRED"
census_role = "only if Chromium-only observation causes an epistemic census gap that needs an independent engine to falsify"

[[secondary_workload]]
family = "MEDIA_ROBOTICS_COMMERCE"
state = "FROZEN_SECONDARY_WORKLOAD"
census_role = "none on the critical path"

# Asked machine-readably before choosing any objective; all false => DEFER.
[selection_rule]
questions = [
  "does it directly improve census closure?",
  "does it directly improve the self-recensus proof?",
  "does it directly improve ADL/.atlas/.atlasx production?",
  "does it directly advance the first-50 donor campaign?",
  "does it directly improve incremental recensus?",
  "does it directly improve extinction/storage recycling?",
  "does it directly improve the construction substrate?",
]
all_false = "DEFER"
frontier_expansion_frozen = true
frontier_addition_requires = "a first-50 dependency needs it, or a missing foundational mechanism has no representative donor; recorded explicitly"

# What a closed census of a selected scope requires. FULL_CENSUS_CLOSED is never claimed without
# every element; the reconciliation certificate (P0) is what asserts it.
[census_closure]
required_elements = [
  "SOURCE_INVENTORY_COMPLETE",
  "ARTIFACT_CONTENT_IDENTITY",
  "LANGUAGE_EXTRACTION",
  "TYPED_SEMANTIC_FACTS",
  "CONTROL_DATA_STATE_EFFECT_SEMANTICS",
  "DEPENDENCY_CLOSURE",
  "SOURCE_BACKED_PROVENANCE",
  "EXPLICIT_UNKNOWNS",
  "NORMALIZATION",
  "ENGINEERING_GRAPH",
  "DETERMINISTIC_REPLAY",
  "RECONCILIATION_CERTIFICATE",
]

# Atlas self-scope at the G57 baseline (4fcb0d6819), from its own census.
[census_closure.self_scope_g57]
SOURCE_INVENTORY_COMPLETE = "PARTIAL: 98 artifacts; apps/cli (the atlas-systemizer crate) is outside the manifest's source roots and is not censused; 8 artifacts UNKNOWN (HTML/CSS fixtures, .in vector files)"
ARTIFACT_CONTENT_IDENTITY = "OBSERVED: BLAKE3 per inventoried artifact; .atlas markdown docs are counted but not content-identified"
LANGUAGE_EXTRACTION = "PARTIAL: rust semantic extractor; javascript/json/toml/markdown parsed only; html/css/.in unsupported"
TYPED_SEMANTIC_FACTS = "PARTIAL: SYMBOL, TYPE, FUNCTION_IDENTITY, FUNCTION_SIGNATURE OBSERVED"
CONTROL_DATA_STATE_EFFECT_SEMANTICS = "UNKNOWN: CALL, CONTROL_FLOW, DATA_FLOW, STATE, EFFECT, OWNERSHIP, CONCURRENCY, PERSISTENCE coverage UNKNOWN; 624 INCOMPLETE_ANALYSIS diagnostics"
DEPENDENCY_CLOSURE = "OBSERVED: cargo closure CLOSED (39 edges, 23 instances, 0 dangling, 9 dynamic obligations)"
SOURCE_BACKED_PROVENANCE = "PARTIAL (corrected by the G59 certificate): 230 facts without revision (ADL-derived), 120 without extractor (obligations for uncovered artifacts)"
EXPLICIT_UNKNOWNS = "OBSERVED: 632 UNKNOWN + 120 UNSUPPORTED facts represented"
NORMALIZATION = "OBSERVED: 10482 -> 10482 normalized, 0 conflicts"
ENGINEERING_GRAPH = "OBSERVED: 61739 nodes, 78759 edges, 139 bindings"
DETERMINISTIC_REPLAY = "OBSERVED: two censuses of 4fcb0d6819 give census digest 81c7931c53cd... (G57)"
RECONCILIATION_CERTIFICATE = "PRESENT_G59: state CENSUSED (see ADR 0025 blockers)"
verdict = "NOT_CLOSED"

# Element changes since the G57 snapshot, each proven by self-recensus (evidence/census/G<n>).
[census_closure.progress]
G60 = "SOURCE_INVENTORY_COMPLETE: apps/cli in scope; 4 of 4 source-backed workspace members censused"
G61 = "SOURCE_INVENTORY_COMPLETE + LANGUAGE_EXTRACTION: 0 artifacts without a source frontend (html, css registered; 3 .in files classified rust-include-fragment by their observed include!); their 96 obligations are explicit UNSUPPORTED; provenance without extractor rises 132 -> 228 (unsupported-language batches carry no extractor identity)"
G62 = "SOURCE_BACKED_PROVENANCE: OBSERVED -- every census fact carries the census revision and a named producer (0/0 gaps); RECONCILIATION_CERTIFICATE: self-scope RECONCILED"
G63 = "ADL <- census: authored depends_on reconciled against the dependency census (4 SATISFIED; WebUI -> Runtime not censusable); census findings adapter -> core and the atlas-cli member derived into .atlas/declared/census.adl"
G64 = "RECONCILIATION_CERTIFICATE: census state packages into a verified unsealed .atlas census container (ATLAS wire v1); the certificate records its root identity (ATLAS_ROOT_ABSENT -> ATLAS_ROOT_UNSEALED)"
G65 = "P4 input from the tree-sitter cycle: a warm self-recensus spends ~6 s outside parsing/extraction (extraction of all 89 Rust artifacts is ~3-4 s cold and cached per artifact) -- incremental recensus must target inventory digesting, census build, normalization and graph, not parsing"
G66 = "P1 precision + P4 input from the scip cycle: self-recensus now proves entity-level correspondence (snapshot v3). P4: extraction batches embed the revision, so no batch survives a commit; revision-stable descriptors are the prerequisite for cross-commit reuse and for invalidating by changed entity instead of changed file -- together with the ~6 s spent outside parsing (G65), the P4 targets are inventory hashing, census build, normalization, graph and revision-independent batch keys"
G67 = "P0 census correctness from the kythe cycle: symbol/type identity carries its source artifact; 203 cross-file conflated ids -> 0; 609 graph nodes the census had silently dropped are restored"
G68 = "P2 artifact integrity from the glean cycle: .atlas schema_id derived from declared record schemas; a tag-repurposing version is refused instead of silently misread"
G69 = "P0 input from the joern cycle: CALL/DATA_FLOW/... UNKNOWN is a resolution gap (Joern itself resolves Rust through an external rust_ast_gen and falls back to Any); a graph layer cannot close it -- compiler-grade resolution can (rust #15, miri #16; rust-analyzer #4 DECIDED partial). Graph is 650-4,500x below columnar scale"
G73 = "P0 measured: Atlas resolves 0 of 12,671 call sites; the pinned toolchain rust-analyzer (SCIP) resolves ~89% -- compiler-grade resolution is the EXTERNAL_BOUNDARY oracle that can close CALL coverage and MULTI_ENGINE_RECONCILIATION_ABSENT (G74)"
G74 = "P0 CALL identity: a chain's calls shared their first token and collapsed into one record (3,888 of 18,035 call sites silently erased); anchored at the callee name, CALL records 12,671 -> 16,072 = an independent syntax enumeration of the profile. Oracle-as-census-engine rejected for now: CI has no rust-analyzer, so it would make the census environment-dependent; it becomes the verification oracle of native path resolution (G75)"
G75 = "P0 CALL resolution: hir-def name resolution absorbed natively (rust-analyzer #4) as a second CALL engine; 3,731 path calls resolved to their FunctionIdentity, all confirmed by the pinned SCIP oracle (95.1% recall); CALLS graph edges; the multi-engine blocker now names each single-engine dimension instead of clearing on any one"
G76 = "P0 input from the miri cycle: EFFECT observes only panic candidates while 504 call sites reach effectful std modules (fs 352, process 63, env 50, io 20, time 17, thread 2); the mechanism is std-path resolution + a declared effect table on top of G75, not interpretation (0 unsafe constructs; Miri nightly-only)"
G77 = "P0 EFFECT: filesystem effect sites derived from resolved std paths through a declared table -- 323 DERIVED FILESYSTEM_READ/WRITE sites (all confirmed by SCIP); EFFECT has two engines; env/time/process-spawn stay unobserved, never mislabeled"
G78 = "P0 input from the clef cycle: the residual CALL gap is 10,776 method calls; 595 self.m() calls reach a workspace inherent method and are decidable natively by the method probe's first step when receiver forms match (G79)"
G79 = "P0 CALL: self.m() resolved by the method probe's first step -- 496 more calls, all SCIP-confirmed (4,227 CALL claims resolved natively in total)"
G80 = "P4 measured from the proof chain: edits touch a median 3 of ~117 artifacts, full self-recensus ~7.8 s (extraction ~3.8 s, memoizable), analyzer changes invalidate everything -- shallow invalidation plus recompute suffices (differential-dataflow REFERENCE_ONLY); self-recensus does not yet use the extraction cache"
G82 = "P0 input from the egglog cycle: 49 TYPE classes carry one type under several spellings (598 occurrences; 13 need congruence over generic arguments); all are equal by name resolution, so canonical type identity is a bottom-up resolution over the G75 DefMap, not an e-graph (G83)"

# Exit criteria of the first phase; broad expansion stays frozen until all are MET.
[exit_criteria]
A_self_recensus_mandatory_and_operational = "MET_G57 (enforced by generation_ledger_self_recensus_chain)"
B_reconciliation_certificate = "MET_G59 (CensusCertificate v2 computed; self-scope CENSUSED with typed blockers; RECONCILED since G62)"
C_adl_consumes_census_truth = "MET_G63 (minimum: member-level dependency architecture reconciled both ways and derived as .atlas/declared/census.adl; external packages, symbols, effects and state are not yet lowered to ADL)"
D_atlas_writer_reader_validator = "MET_G64 (minimum: ATLAS wire v1 unsealed census container -- writer, verifying reader, transactional publication, certificate root identity; sealing, compression and sharding deferred)"
E_atlasx_production_validation = "BLOCKED_ON_PREREQUISITES (G65 contract survey): canonical AtlasX requires a SEALED parent .atlas root, a SelectedDesign in state SELECTED (never selected merely because one candidate exists) and an ArchitecturalIntegrityEnvelope (ATLAS-TO-ATLASX.md L11/L55-96, SELECTED-DESIGN.md L427-443, genome [atlasx_format]); no AtlasX contract permits an unsealed/candidate profile. Next P2 step when unblocked: seal gate + SelectedDesign, then the AtlasX precondition gate, wire codec and validator"
F_first_50_queue_canonical = "MET_G58 (FIRST-50-CAMPAIGN.toml, enforced by first_50_campaign_is_canonical_and_accounted)"
G_first_50_sequential_lifecycle_substantial = "OPEN: 3 historic terminals + 15 campaign terminals (egglog #19 G82 REFERENCE_ONLY; buck2 #18 G81 DEFERRED to AIF1; differential-dataflow #17 G80 REFERENCE_ONLY; clef #16 G78 REFERENCE_ONLY; miri #15 G76 REFERENCE_ONLY; rust-analyzer #4 G75 ABSORBED; tree-sitter #6 G65 REFERENCE_ONLY; scip #7 G66 ABSORBED; kythe #8 G67 ABSORBED; glean #9 G68 ABSORBED; joern #10 G69 REFERENCE_ONLY; semgrep #11 G70 REFERENCE_ONLY; ast-grep #12 G71 REFERENCE_ONLY; sourcetrail #13 G72 REFERENCE_ONLY; rust #14 G73 EXTERNAL_BOUNDARY), all extinct; G74 P0 CALL identity; rust-analyzer #4 G75 ABSORBED (path resolution); miri #15 G76 REFERENCE_ONLY; G77 P0 EFFECT done; clef #16 G78 REFERENCE_ONLY; G79 P0 self.m() done; differential-dataflow #17 G80 REFERENCE_ONLY; buck2 #18 G81 DEFERRED (AIF1); egglog #19 G82 REFERENCE_ONLY; next G83 P0 canonical types, then capnproto (#20)"
H_incremental_recensus_with_oracle = "OPEN"
I_extinction_reclaim_under_bounded_storage = "PARTIAL: working set exists (G54); no post-extinction recensus yet"

