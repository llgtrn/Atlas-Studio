# G116 retrospective re-audit of every first-50 donor decision. Two independent questions per donor:
#   q1_mechanism   -- does Atlas need THIS donor's mechanism? YES | NO | NOT_YET | EXTERNAL_BOUNDARY
#   q2_capability  -- the underlying capability: ESSENTIAL_OPEN | ESSENTIAL_CLOSED | SCALE_TRIGGERED | OPTIONAL
# conflated = true marks a decision whose recorded reasoning used NOT_NOW evidence (no consumer, small
# graph, fast enough, the repository has no case) as if it were NOT_ARCHITECTURALLY_REQUIRED; the quote
# is the recorded phrase. Historic terminal states are NOT reverted: the donor stays terminal, the
# capability stays open in the debt ledger (anti-avoidance rule). advanced = the decision raised the
# maturity of a linked debt (skip-budget input). Enforced by runtime tests essential_complexity::*.

