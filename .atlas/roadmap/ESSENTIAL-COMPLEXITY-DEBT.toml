# The essential complexity debt ledger and architecture pressure map (G116 retrospective audit).
# One [[debt]] per ESSENTIAL capability that is not closed; [[scale_trigger]] for SCALE_TRIGGERED
# capabilities; [[native_attack]] is the ordered native_attack_queue that preempts donor progression.
# age_generations / stale_generations are recorded as of `ages_as_of`; the live alarm is recomputed
# by runtime tests (essential_complexity::*) from the ledger head in GENERATIONS.toml:
#   stale > review_threshold     -> reviewed_in within review_threshold generations of the head
#   stale > escalation_threshold -> escalated = true and the debt is queued, blocked by a queued
#                                   debt, or frozen with an unfreeze_gate
#   skip budget (3 consecutive non-advancing donor decisions after the last advance, from the
#   reaudit) -> skip_budget_triggered = true and the same queue obligation.
# A debt leaves this ledger only as CLOSED with closure_kind NATIVE_SOLUTION,
# PERMANENT_EXTERNAL_BOUNDARY or PROVEN_ALTERNATIVE and closure evidence that is not a donor decision.

