debts = ["DEBT-CONTROL_FLOW", "DEBT-DATA_FLOW", "DEBT-STATE", "DEBT-EFFECT", "DEBT-OWNERSHIP", "DEBT-CONCURRENCY", "DEBT-PERSISTENCE"]
families = ["data_flow", "rust_execution_semantics", "undefined_behavior_detection"]

