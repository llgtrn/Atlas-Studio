# PRODUCT and COMMERCE are declared end-state domains (frozen as secondary workloads). Their
# donors' mechanisms are not needed, but a bill of materials and a price are quantities over
# physical parts, so the cluster routes into the core primitives those domains depend on.
[[cluster]]
id = "PRODUCT_COMMERCE"
class = "ESSENTIAL"
debts = ["DEBT-QUANTITY_UNITS", "DEBT-PHYSICAL_ONTOLOGY"]
families = ["product_bom_costing", "product_ecommerce"]

# MEDIA is a declared domain, but media tools' mechanisms are optional to the architecture as long
# as artifacts, effects and provenance (core debts) can represent media products.
[[cluster]]
id = "MEDIA"
class = "OPTIONAL"
debts = []
families = ["media_workflow", "media_codegen", "higgsfield"]

# The Studio is a projection over the engine (NORTH-STAR sequencing puts UI last); these
# mechanisms do not block engine capabilities.
[[cluster]]
id = "STUDIO_PROJECTION"
class = "OPTIONAL"
debts = []
families = ["ide", "editor", "graph_rendering", "large_graph_interaction", "graph_layout", "automatic_layout", "graph_interaction", "node_editor", "source_graph_visualization", "design_authoring", "visual_system", "scene_graph", "layout_constraints", "interaction_state", "front-end"]

# Family-less frontier entries, placed by name.
[[unfamilied]]
name = "Docker"
cluster = "SANDBOXING"

[[unfamilied]]
name = "Cargo"
cluster = "SEMANTIC_RESOLUTION"
