schema = "atlas.frontier-capability-clusters.v1"
canonical = true
established_in = "G116"
contract = ".atlas/contracts/ESSENTIAL-COMPLEXITY.md"
frontier = ".atlas/roadmap/RECOMMENDED-OSS-FRONTIER.toml"
debt_ledger = ".atlas/roadmap/ESSENTIAL-COMPLEXITY-DEBT.toml"

# The 153-repository frontier classified by the capability it could attack (G116 audit). This is
# not a deep census: each repository is placed through its recorded `families`, and each cluster
# names the essential or scale-triggered debts (ids in ESSENTIAL-COMPLEXITY-DEBT.toml) it is a
# route into. A cluster with no debt is OPTIONAL. Enforced by runtime test
# essential_complexity::every_frontier_family_routes_to_a_capability_cluster: every family of
# every frontier repository appears in exactly one cluster, and every debt id named here exists.

[[cluster]]
id = "SEMANTIC_RESOLUTION"
class = "ESSENTIAL"
debts = ["DEBT-CALL", "DEBT-TYPE", "DEBT-SYMBOL", "DEBT-MULTI_ENGINE", "DEBT-MULTILANGUAGE"]
families = ["compiler_frontend", "type_resolution", "rust_semantics", "borrow_checker", "symbol_identity", "semantic_index_exchange", "semantic_cross_reference", "cross_reference", "source_facts", "schema_indexing", "symbol_navigation", "syntax_trees", "incremental_parsing", "semantic_search", "pattern_matching", "structural_search", "static_analysis", "semantic_graph", "program_semantic_graph", "graph_native_language", "code_property_graph"]

