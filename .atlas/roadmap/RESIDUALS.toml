[[residual]]
id = "RES-G178-LOCKED-TRAITS-LIB-NAME-BY-LINES"
found_in = "G178"
source = ".atlas/decisions/0091-imports-settle-as-rustc-binds-them.md"
subsystem = "adapter semantic::rust::locked_traits (manifest_field)"
reproduction = "a locked registry package whose Cargo.toml gives [lib] name in a form the line reader misreads -- a name = line inside a multi-line string of the [lib] table, a dotted lib.name key, a header with a trailing comment: manifest_field returns another value or none. None is safe (named_by_key keeps the key only when the package is UNKNOWN anyway); a wrong value can make named_by_key take the key for the library name"
severity = "LOW"
can_create_false_claim = true
false_claim_condition = "a locked registry package whose manifest Cargo did not normalize (published before cargo package rewrote manifests, or uploaded by another tool) and whose [lib] name the line reader misreads to another value: the autoref guard may read that package's items under the wrong name and trust a method claim. It does not hold on the current tree: the line reader and tomllib agree on [lib] name for all 33 registry manifests Atlas locks (G179)"
reopen_trigger = "a lock closure in census scope gains a registry manifest that is not in Cargo's normalized form"
status = "OPEN"
pressure = 3

