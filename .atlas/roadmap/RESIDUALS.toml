reproduction = "mod m { pub mod x { pub fn f() {} } } mod named { use crate::m::x; use self::x::f as x; pub fn t() { x(); } } -- cargo build accepts it and rustc binds x() to m::x::f; Atlas E24 leaves x() unresolved, because own_named skips an import whose path starts with self:: and the import then reads its own binding (scratch policy/rep1)"
severity = "LOW"
can_create_false_claim = false
reopen_trigger = "a replay or self-census withholding a call through a self::-prefixed import that names another import of its own name"
