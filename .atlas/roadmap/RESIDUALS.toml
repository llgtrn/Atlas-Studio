[[residual]]
id = "RES-G178-LIB-NAME-DIFFERS-FROM-KEY"
found_in = "G178"
source = "adapter/src/semantic/rust/resolve.rs (known_extern), runtime/src/census/resolution.rs"
subsystem = "runtime census::resolution (declared dependency names), adapter semantic::rust::resolve"
reproduction = "a crate declaring an unrenamed registry or git dependency zipper whose package sets [lib] name = zip, with use std::iter::zip; and a call zip::open() -- rustc binds zip::open to the dependency (the function import binds only the value namespace, so zip:: reaches the extern prelude); Atlas puts the key zipper, not zip, in the declared names, so zip reads as absent and the unsure import is trusted. At G179 a git fixture of that shape (scratch policy/rep2, zipper at file://) left zip::open and s.look() unresolved in the agent model, which cannot show path-level external claims"
severity = "MEDIUM"
can_create_false_claim = true
false_claim_condition = "an unrenamed registry or git dependency whose [lib] name differs from its key, beside an unsure import of the library name: the call is claimed as the imported item's path (std::iter::zip::open) where rustc calls the dependency. It does not hold on the current tree: Atlas has no git dependency, and cargo metadata at G179 shows no direct dependency of a workspace member whose library name differs from its key"
reopen_trigger = "a workspace in census scope gains a registry or git dependency whose library name differs from its key, or a replay's donor has one"
attack = "NA-DEPENDENCY-DECLARATIONS"
status = "OPEN"
pressure = 9

