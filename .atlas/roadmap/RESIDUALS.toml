[[residual]]
id = "RES-G179-SEAL-SELF-CERTIFYING"
found_in = "G179"
source = "core/src/atlas (SEALED container, M9), core/src/atlasx/precondition.rs (M10)"
subsystem = "core seal M9 and atlasx precondition M10"
reproduction = "take any unsealed census container; build a SealRecord with arbitrary policy, report, envelope and design ids, copying the manifest's certificate, census and revision, covering every blocker in permitted and setting seal_id = seal_identity(record); atlas::write accepts it, it reads back SEALED, and atlasx precondition ADMITs it with a matching envelope and SELECTED design although no seal gate ran -- the seal identity is a digest, not a signature"
severity = "HIGH"
can_create_false_claim = true
false_claim_condition = "a consumer treats ADMITTED as proof that the seal gate decided the seal, for a SEALED container not produced by seal_container from an ELIGIBLE decision. It does not hold on the current tree: ADMITTED is documented (ADR 0093) as binding only, every verdict lists the seal policy, verification and integrity reports among the steps it does not verify, no SEALED container exists in the tree or its evidence, and nothing materializes"
reopen_trigger = "before the AtlasX materializer (M11) consumes an admitted parent, or when any SEALED container is committed"
attack = "NA-ATLASX-MATERIALIZE"
status = "OPEN"
pressure = 27

