# The residual ledger (G179, ADR 0092). A residual is a known gap a generation recorded instead of
# fixing: a claim withheld, an input read as absent, a case outside the model. Each carries its exact
# reproduction, a severity and whether it can make Atlas assert something false. A HARDENING
# generation may run outside the lane cadence only to close an OPEN residual whose
# can_create_false_claim is true (GENERATIONS.toml correctness_blocker = <id>). attack, when present,
# names the queued native attack that closes the residual: a false-claim residual naming the HARDENING
# queue head brings it out of LANE_DEFERRED into the next CREATION slot as its correctness blocker.
#
#   pressure = severity weight (LOW 1, MEDIUM 3, HIGH 9) x (false_claim_multiplier if
#              can_create_false_claim else 1)
#
# false_claim_condition is present exactly when can_create_false_claim is true: the exact condition
# under which the claim would be false, and why it does not hold on the current tree.
# runtime tests (essential_complexity::residuals_carry_reproduction_severity_and_pressure) recompute
# the pressure and check every field. Scratch reproductions named below were run at G179 with the
# E24 release binary (atlas-systemizer agent model) and cargo 1.90.0.

schema = "atlas.residuals.v1"
canonical = true
established_in = "G179"
decision = ".atlas/decisions/0092-correctness-must-enable-construction.md"
severities = ["LOW", "MEDIUM", "HIGH"]
severity_weight_low = 1
severity_weight_medium = 3
severity_weight_high = 9
false_claim_multiplier = 3
statuses = ["OPEN", "CLOSED"]

[[residual]]
id = "RES-G178-IMPORT-ORDER"
found_in = "G178"
source = ".atlas/decisions/0091-imports-settle-as-rustc-binds-them.md"
subsystem = "adapter semantic::rust::resolve (Scope::insert, Entry::unsure)"
reproduction = "one scope binds the same external item twice by name, once certain and once unsure (Entry::unsure); Scope::insert keeps the first binding and ANDs the flags, so the claim or a withhold depends on which import it applies first (ADR 0091 Consequences). Never a wrong claim. At G179 the module-level pair use crate::m::zip; beside use std::iter::zip; withholds zip::g() in both orders (scratch policy/rep3, app certain_first and unsure_first), so the order-dependent pair is narrower than that"
severity = "LOW"
can_create_false_claim = false
reopen_trigger = "a replay or self-census whose withheld path calls name a same-named certain and unsure import pair in one scope"
status = "OPEN"
pressure = 1

[[residual]]
id = "RES-G178-SELF-PREFIXED-IMPORT"
