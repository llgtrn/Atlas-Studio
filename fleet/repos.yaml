schema_version: 4
docs_standard: atlas.docs.v1
cli_api: atlas.systemizer.cli.v1

connection:
  auto_connect_registered_repositories: true
  mode: READ_ONLY_OBSERVATION
  resolve_exact_head_sha: true
  target_repo_requires_atlas_metadata: false
  canonical_docs_root: docs

coding:
  mode: ONE_REPOSITORY_AT_A_TIME
  docs_gate_required: true
  graph_before_code_required: true
  exact_base_sha_required: true
  shared_mutable_checkout_forbidden: true
  atlas_merge_authority: false

managed_repositories:
  - { repo: llgtrn/Chronica, ref: main, role: CANONICAL_PRODUCT }
  - { repo: llgtrn/Atlas-Systemizer, ref: main, role: ENGINEERING_SUBSYSTEM }
  - { repo: llgtrn/PlatformDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/EdgeDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/Web2AppDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/PhysicalDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/SimulationDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/CommerceDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/FinanceDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/CustomerDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/HospitalityDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/EstateDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/LegalDev, ref: main, role: DEVELOPMENT_CELL }
  - { repo: llgtrn/OSINTDev, ref: main, role: DEVELOPMENT_CELL }
